name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.15 quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.13.0
          enable-cache: true

      - name: Install HDF5 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libhdf5-dev pkg-config tesseract-ocr

      - name: Install CPython 3.15.0
        run: uv python install 3.15.0

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups --extra radio --extra disclosure --python 3.15.0

      - name: Smoke-test the Python 3.15 radio stack
        run: uv run --locked python -c "import astropy, blimpy, fsspec, hdf5plugin, h5py, numpy, polars, setigen, turbo_seti"

      - name: Check formatting and lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Type-check
        # Non-blocking since the 2026-10-13 merge of the night branches: 31 strict errors
        # remain in modules written before the strict gate existed. Tracked as a Grok task;
        # drop continue-on-error once `make types` is clean.
        continue-on-error: true
        run: uv run --locked mypy --strict src/xenia

      - name: Check committed files
        run: uv run --locked python scripts/check_repository_files.py

      - name: Check generated schemas
        run: uv run --locked xenia schemas export --check

      - name: Test
        run: uv run --locked pytest --cov=xenia --cov-report=term-missing

      - name: Build demo state for schema contract
        run: uv run --locked xenia live build-state --runs tests/fixtures/live --output runs/state.json --demo

      - name: Validate state JSON against committed schema
        run: uv run --locked xenia schemas validate-state --state runs/state.json --schema schemas/live_state.schema.json

      - name: Build static project documentation (no deployment)
        run: uv run --locked mkdocs build --strict --site-dir /tmp/theoxenia-docs
