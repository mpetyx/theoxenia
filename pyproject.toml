[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "theoxenia"
version = "0.1.0"
description = "An evidence-first, reproducible Python lab for public radio technosignature data."
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
authors = [{ name = "Michael Petychakis" }]
keywords = ["radio astronomy", "technosignatures", "SETI", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dependencies = [
  "jinja2>=3.1.6,<4",
  "jsonschema>=4.25,<5",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
disclosure = [
  "opencv-python-headless>=5.0.0.93,<6",
  "pymupdf>=1.28.2,<2",
]
radio = [
  "aiohttp>=3.14,<4",
  "astropy>=8,<9",
  "blimpy>=2.1.4,<3",
  "fsspec>=2026.9,<2027",
  "hdf5plugin>=7,<8",
  "h5py>=3.16,<4",
  "matplotlib>=3.10,<4",
  "numpy>=2.5,<3",
  "polars>=1.44.2,<2",
  "pyparsing==3.3.3",
  "setigen>=2.7,<3",
  "setuptools==80.9.0",
  "turbo-seti==2.3.2",
]
reports = [
    "reportlab==4.4.9",
]

[project.scripts]
xenia = "xenia.cli:main"

[project.urls]
Homepage = "https://github.com/mpetyx/theoxenia"
Repository = "https://github.com/mpetyx/theoxenia"
Issues = "https://github.com/mpetyx/theoxenia/issues"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.140,<7",
  "mkdocs-material>=9.6,<10",
  "mypy>=1.18,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
]

[tool.uv]
required-version = ">=0.13.0"
override-dependencies = ["pyparsing==3.3.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/xenia"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xenia"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"
packages = ["xenia"]

[[tool.mypy.overrides]]
module = [
  "astropy.*",
  "blimpy.*",
  "cv2",
  "cv2.*",
  "fsspec.*",
  "jsonschema",
  "jsonschema.*",
  "h5py",
  "h5py.*",
  "matplotlib.*",
  "yaml",
  "pandas",
  "pandas.*",
  "pymupdf",
  "pymupdf.*",
  "turbo_seti.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py315"
exclude = ["site/build"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
